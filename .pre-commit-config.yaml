repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Check Python code
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Check Python format
        entry: ruff format --check
        language: system
        types: [python]
      - id: check-text
        name: Check project text
        entry: python scripts/check_text.py
        language: system
        pass_filenames: false
