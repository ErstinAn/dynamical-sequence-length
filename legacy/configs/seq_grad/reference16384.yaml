name: llama3-100m-seq-grad-ref16384-bs128-train2048
torchtitan_config: llama3_100m_llama2_adamw_seq_grad
paths:
  dump_root: ${OUTPUT_ROOT}/runs
  slurm_log_root: ${OUTPUT_ROOT}/slurm_logs
  manifest_root: ${OUTPUT_ROOT}/experiments
  hf_home: ${OUTPUT_ROOT}/cache/huggingface
  torch_home: ${OUTPUT_ROOT}/cache/torch
  validation_dir: ${ASSETS_DIR}/data/fineweb100_validation_llama2_1024
wandb:
  enabled: true
  project: finweb-llama-100m-seq-grad-distance
  entity: ''
  mode: offline
fixed:
  hf_assets_path: ${ASSETS_DIR}/hf/llama-tokenizer
  dataloader.dataset: fineweb_100bt
  dataloader.dataset_path: HuggingFaceFW/fineweb
  dataloader.infinite: true
  dataloader.num_workers: 0
  dataloader.pin_memory: true
  dataloader.prefetch_factor: null
  dataloader.persistent_workers: false
  training.steps: 7680
  training.seq_len: 2048
  training.global_batch_size: 128
  training.max_norm: 1.0
  training.dtype: float32
  training.mixed_precision_param: bfloat16
  training.mixed_precision_reduce: float32
  lr_scheduler.warmup_steps: 0
  lr_scheduler.decay_type: linear
  lr_scheduler.min_lr_factor: 1.0
  loss.num_chunks: 8
  compile.enable: false
  debug.seed: 1
  debug.print_config: true
  comm.train_timeout_seconds: 600
  checkpoint.enable: true
  checkpoint.folder: checkpoint
  checkpoint.interval: 200
  checkpoint.keep_latest_k: 2
  checkpoint.last_save_model_only: false
  validator.enable: true
  validator.freq: 200
  validator.token_budget: 20971520
  validator.eval_local_batch_size: 32
  validator.artifact_path: ''
  validator.dataloader.dataset: fineweb_100bt_validation
  validator.dataloader.dataset_path: null
  validator.dataloader.num_workers: 0
  validator.dataloader.pin_memory: false
  validator.dataloader.persistent_workers: false
  metrics.log_freq: 1
  metrics.disable_color_printing: true
  optimizer.weight_decay: 0.1
  optimizer.vector_weight_decay: 0.0
  optimizer.beta1: 0.9
  optimizer.beta2: 0.95
  training.local_batch_size: 1
  optimizer.method: adamw
  validator.eval_seq_len: 1024
  optimizer.learning_rate: 0.0005
  seq_grad.enable: true
  seq_grad.lengths:
  - 64
  - 256
  - 384
  - 512
  - 576
  - 640
  - 704
  - 768
  - 832
  - 896
  - 960
  - 1024
  - 1280
  - 1536
  - 2048
  - 4096
  seq_grad.seed: 12345
  seq_grad.reference_length: 16384
  seq_grad.probe_global_batch_size: 256
  seq_grad.interval: 50
  seq_grad.include_initial: true
sweep: {}
