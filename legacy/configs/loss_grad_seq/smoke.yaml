fixed:
  checkpoint.enable: true
  checkpoint.folder: checkpoint
  checkpoint.interval: 4
  checkpoint.keep_latest_k: 2
  checkpoint.last_save_model_only: false
  comm.train_timeout_seconds: 600
  compile.enable: false
  dataloader.dataset: sequence_length_smoke
  dataloader.dataset_path: ${PROJECT_ROOT}/tests/fixtures/text.jsonl
  dataloader.infinite: true
  dataloader.num_workers: 0
  dataloader.persistent_workers: false
  dataloader.pin_memory: true
  dataloader.prefetch_factor: null
  debug.print_config: true
  debug.seed: 1
  hf_assets_path: ${ASSETS_DIR}/hf/llama-tokenizer
  loss.num_chunks: 4
  lr_scheduler.decay_type: linear
  lr_scheduler.min_lr_factor: 1.0
  lr_scheduler.warmup_steps: 0
  metrics.disable_color_printing: true
  metrics.log_freq: 1
  optimizer.beta1: 0.9
  optimizer.beta2: 0.95
  optimizer.learning_rate: 0.0005
  optimizer.method: adamw
  optimizer.vector_weight_decay: 0.0
  optimizer.weight_decay: 0.1
  training.dtype: float32
  training.global_batch_size: 8
  training.local_batch_size: 4
  training.max_norm: 1.0
  training.mixed_precision_param: bfloat16
  training.mixed_precision_reduce: float32
  training.seq_len: 64
  training.steps: 9
  validator.artifact_path: ''
  validator.dataloader.dataset: sequence_length_smoke
  validator.dataloader.dataset_path: ${PROJECT_ROOT}/tests/fixtures/text.jsonl
  validator.dataloader.num_workers: 0
  validator.dataloader.persistent_workers: false
  validator.dataloader.pin_memory: false
  validator.enable: true
  validator.eval_local_batch_size: 2
  validator.eval_seq_len: 64
  validator.freq: 1
  validator.token_budget: 0
  loss_seq_len_scheduler.kind: constant
  loss_seq_len_scheduler.length: 64
  grad_seq_len_scheduler.kind: cyclic
  grad_seq_len_scheduler.min_length: 16
  grad_seq_len_scheduler.max_length: 64
  grad_seq_len_scheduler.period_steps: 8
  grad_seq_len_scheduler.round_to_multiple: 4
  batch_size_scheduler.kind: constant
  batch_size_scheduler.batch_size: 8
  loss_microbatch_scheduler.kind: constant
  loss_microbatch_scheduler.batch_size: 1
  grad_microbatch_scheduler.kind: constant
  grad_microbatch_scheduler.batch_size: 4
  loss_tokens_per_microbatch: 0
  grad_tokens_per_microbatch: 0
  crop_seed: 1
  validator.steps: 2
name: loss-grad-constant-bs-cyclic-seq-smoke
paths:
  dump_root: ${OUTPUT_ROOT}/runs
  hf_home: /projects/jason_optai/kangan/huggingface
  manifest_root: ${OUTPUT_ROOT}/experiments
  slurm_log_root: ${OUTPUT_ROOT}/slurm_logs
  torch_home: ${OUTPUT_ROOT}/cache/torch
  validation_dir: ${ASSETS_DIR}/data/fineweb100_validation_llama2_1024
resources:
  account: jason_optai-paid
  cluster: owl
  cpus_per_task: 16
  gpus_per_node: 2
  max_concurrent: 1
  nodes: 1
  partition: b200_normal_q
  qos: owl_b200_normal_short
  time: 00:15:00
sweep: {}
torchtitan_config: llama3_debug_loss_grad_seq
wandb:
  enabled: true
  entity: dynamic_seq_length
  group: loss-grad-independent-batches
  mode: online
  project: dynamic-seq-bs-debug
