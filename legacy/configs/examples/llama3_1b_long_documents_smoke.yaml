name: llama3-1b-long-documents-smoke
torchtitan_config: llama3_1b_long_documents
paths:
  dump_root: /scratch/kangan/fineweb-edu-long-87f09149/runs
wandb:
  enabled: false
fixed:
  hf_assets_path: ${ASSETS_DIR}/hf/llama3-tokenizer
  dataloader.dataset_path: /projects/jason_optai/kangan/datasets/fineweb-edu-long-30b
  validator.dataloader.dataset_path: /projects/jason_optai/kangan/datasets/fineweb-edu-long-30b
  training.steps: 3
  training.seq_len: 32768
  training.local_batch_size: 1
  training.global_batch_size: 1
  training.dtype: float32
  training.mixed_precision_param: bfloat16
  training.mixed_precision_reduce: float32
  optimizer.learning_rate: 0.0001
  lr_scheduler.warmup_steps: 0
  lr_scheduler.min_lr_factor: 1.0
  compile.enable: false
  checkpoint.enable: false
  validator.enable: true
  validator.freq: 3
  validator.steps: 2
  validator.eval_seq_len: 32768
  validator.eval_local_batch_size: 1
  metrics.log_freq: 1
  metrics.disable_color_printing: true
  debug.seed: 42
sweep: {}
