name: dynamic-seq-bs-smoke
torchtitan_config: llama3_debug_dynamic_seq_bs
paths:
  dump_root: ${OUTPUT_ROOT}/runs
wandb:
  enabled: false
  project: dynamic-seq-debug
  entity: ''
  mode: offline
fixed:
  dataloader.dataset: sequence_length_smoke
  dataloader.dataset_path: ${PROJECT_ROOT}/tests/fixtures/text.jsonl
  dataloader.num_workers: 0
  dataloader.pin_memory: false
  dataloader.persistent_workers: false
  dataloader.infinite: true
  training.steps: 8
  training.seq_len: 64
  training.local_batch_size: 2
  training.global_batch_size: 8
  training.dtype: float32
  training.mixed_precision_param: float32
  training.mixed_precision_reduce: float32
  compile.enable: false
  loss.num_chunks: 2
  debug.seed: 42
  debug.deterministic: true
  checkpoint.enable: false
  validator.enable: false
  seq_len_scheduler.kind: triangular
  seq_len_scheduler.lengths:
  - 16
  - 32
  - 64
  seq_len_scheduler.period_steps: 4
  metrics.log_freq: 1
  batch_size_scheduler.kind: triangular
  batch_size_scheduler.batch_sizes:
  - 8
  - 16
  - 32
  batch_size_scheduler.period_steps: 4
  microbatch_scheduler.kind: triangular
  microbatch_scheduler.batch_sizes:
  - 2
  - 4
  microbatch_scheduler.period_steps: 4
sweep: {}
