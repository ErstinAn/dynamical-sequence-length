# Total: 3840 optimizer steps and 2013265920 training tokens.
# BS increases linearly, rounded to multiples of 8. Microbatch is BS / 8.
# Sequence length repeats a symmetric 256-step triangle 15 times.
fixed:
  checkpoint.enable: true
  checkpoint.folder: checkpoint
  checkpoint.interval: 200
  checkpoint.keep_latest_k: 2
  checkpoint.last_save_model_only: false
  comm.train_timeout_seconds: 600
  compile.enable: true
  dataloader.dataset: fineweb_100bt
  dataloader.dataset_path: HuggingFaceFW/fineweb
  dataloader.infinite: true
  dataloader.num_workers: 0
  dataloader.persistent_workers: false
  dataloader.pin_memory: true
  dataloader.prefetch_factor: null
  debug.print_config: true
  debug.seed: 1
  hf_assets_path: ${ASSETS_DIR}/hf/llama-tokenizer
  loss.num_chunks: 4
  lr_scheduler.decay_type: linear
  lr_scheduler.min_lr_factor: 1.0
  lr_scheduler.warmup_steps: 0
  metrics.disable_color_printing: true
  metrics.log_freq: 1
  optimizer.beta1: 0.9
  optimizer.beta2: 0.95
  optimizer.learning_rate: 0.0005
  optimizer.method: adamw
  optimizer.vector_weight_decay: 0.0
  optimizer.weight_decay: 0.1
  training.dtype: float32
  training.global_batch_size: 256
  training.local_batch_size: 32
  training.max_norm: 1.0
  training.mixed_precision_param: bfloat16
  training.mixed_precision_reduce: float32
  training.seq_len: 2048
  training.steps: 3840
  validator.artifact_path: ''
  validator.dataloader.dataset: fineweb_100bt_validation
  validator.dataloader.dataset_path: null
  validator.dataloader.num_workers: 0
  validator.dataloader.persistent_workers: false
  validator.dataloader.pin_memory: false
  validator.enable: true
  validator.eval_local_batch_size: 32
  validator.eval_seq_len: 2048
  validator.freq: 20
  validator.token_budget: 20971520
  batch_size_scheduler.kind: piecewise_linear
  batch_size_scheduler.anchor_steps:
  - 1
  - 3840
  batch_size_scheduler.batch_sizes:
  - 256
  - 768
  batch_size_scheduler.repeat: false
  batch_size_scheduler.round_to_multiple: 8
  microbatch_scheduler.kind: piecewise_linear
  microbatch_scheduler.anchor_steps:
  - 1
  - 3840
  microbatch_scheduler.batch_sizes:
  - 32
  - 96
  microbatch_scheduler.repeat: false
  microbatch_scheduler.round_to_multiple: 1
  seq_len_scheduler.kind: piecewise_linear
  seq_len_scheduler.anchor_steps:
  - 1
  - 128
  - 129
  - 256
  seq_len_scheduler.lengths:
  - 8
  - 2040
  - 2040
  - 8
  seq_len_scheduler.repeat: true
  seq_len_scheduler.round_to_multiple: 8
name: llama3-100m-linear-bs-cyclic-seq-3840steps-constant-lr5e-4
paths:
  dump_root: ${OUTPUT_ROOT}/runs
  hf_home: ${OUTPUT_ROOT}/cache/huggingface
  manifest_root: ${OUTPUT_ROOT}/experiments
  slurm_log_root: ${OUTPUT_ROOT}/slurm_logs
  torch_home: ${OUTPUT_ROOT}/cache/torch
  validation_dir: ${ASSETS_DIR}/data/fineweb100_validation_llama2_2048
resources:
  account: YOUR_ACCOUNT
  cluster: owl
  cpus_per_task: 16
  gpus_per_node: 2
  max_concurrent: 1
  nodes: 1
  partition: b200_normal_q
  qos: owl_b200_normal_short
  time: 08:00:00
sweep: {}
torchtitan_config: llama3_100m_llama2_adamw_dynamic_seq_bs
wandb:
  enabled: false
  entity: ''
  group: llama3-100m-independent-bs-seq-budget-matched
  mode: offline
  project: finweb-llama-100m-seqbs-joint-scheduler
