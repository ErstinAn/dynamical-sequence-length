# Replace conservative microbatches with measured values from the target GPU probe.
# Smoke saves at steps 2, 4, 6, and 8. Formal runs retain ten token milestones.
name: llama3-1b-sequence-smoke
torchtitan_config: llama3_1b
paths:
  dump_root: ${OUTPUT_ROOT}
wandb:
  enabled: true
  entity: dynamic_seq_length
  project: debug
  mode: online
fixed:
  smoke_test: true
  token_budget: 15728640
  training.steps: 8
  training.seq_len: 16384
  training.global_batch_size: 256
  training.local_batch_size: 1
  training.dtype: float32
  training.mixed_precision_param: bfloat16
  training.mixed_precision_reduce: float32
  seq_len_scheduler.kind: increasing
  seq_len_scheduler.lengths: [2048, 4096, 8192, 16384]
  seq_len_scheduler.boundaries: [2, 4, 6]
  batch_size_scheduler.kind: constant
  batch_size_scheduler.batch_size: 256
  microbatch_scheduler.kind: constant
  microbatch_scheduler.batch_size: 1
  # Smoke-only LR. The formal learning rate and sweep await the experiment document.
  optimizer.learning_rate: 0.0001
  lr_scheduler.warmup_steps: 0
  lr_scheduler.decay_type: linear
  lr_scheduler.min_lr_factor: 1.0
  validator.freq: 8
  validator.eval_local_batch_size: 1
  metrics.log_freq: 1
  metrics.disable_color_printing: true
  debug.seed: 42
  debug.deterministic: true
  compile.enable: false
  comm.train_timeout_seconds: 600
