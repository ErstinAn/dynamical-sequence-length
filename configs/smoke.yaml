name: smoke
torchtitan_config: llama3_debug
paths:
  dump_root: ${OUTPUT_ROOT}/runs
wandb:
  enabled: false
fixed:
  dataloader.dataset: sequence_length_smoke
  dataloader.dataset_path: ${PROJECT_ROOT}/tests/fixtures/text.jsonl
  dataloader.num_workers: 0
  dataloader.pin_memory: false
  dataloader.persistent_workers: false
  dataloader.infinite: true
  training.steps: 10
  training.seq_len: 64
  training.local_batch_size: 2
  training.global_batch_size: 8
  training.dtype: float32
  training.mixed_precision_param: float32
  training.mixed_precision_reduce: float32
  grad_var_monitor.enable: true
  compile.enable: false
  loss.num_chunks: 2
  debug.seed: 42
  debug.deterministic: true
  checkpoint.enable: false
  validator.enable: false
sweep: {}
