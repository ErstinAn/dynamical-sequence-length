[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchtitan-dynamic-seq-len"
version = "0.1.0"
description = "Sequence length experiments with gradient variance measurements"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.15.0.dev20260830+cu130",
  "torchtitan @ git+https://github.com/pytorch/torchtitan.git@737594746fda65a6d94dc9482ef07863a80c8588",
  "datasets==4.7.0",
  "tokenizers==0.23.1",
  "numpy==2.5.2",
  "pyarrow==25.0.1",
  "PyYAML==6.0.3",
  "huggingface-hub==1.29.0",
]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "pre-commit==4.7.0"]

[tool.setuptools.packages.find]
include = ["torchtitan_dynamic_seq_len*"]

[tool.setuptools.package-data]
"torchtitan_dynamic_seq_len.data" = ["manifests/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"cluster/vt_arc/*.py" = ["E402"]
